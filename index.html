</style></head><body><header><small>TBS GROUP · WEB APP</small><h1>TBS Mobile</h1><p>Tất cả Web App trong một nơi</p></header><main class="wrap"><input id="search" placeholder="🔎  Tìm kiếm ứng dụng..." aria-label="Tìm kiếm ứng dụng"><div class="toolbar" id="filters"></div><div class="section"><h2>Ứng dụng của tôi</h2><span id="count"></span></div><div class="grid" id="grid"></div><p class="note">Danh sách trên thiết bị này; chưa đồng bộ Google Sheets. Web App con có thể mở trong Safari và hiển thị banner Google.</p></main><button class="fab" id="add" aria-label="Thêm ứng dụng">+</button><nav class="bottom"><button data-view="all">⌂<br>Trang chủ</button><button data-view="all">▦<br>Ứng dụng</button><button data-view="fav">☆<br>Yêu thích</button><button id="backup">⇩<br>Xuất JSON</button><button id="import">⇧<br>Nhập JSON</button></nav><dialog id="editor"><form id="form"><h2 id="formtitle">Thêm ứng dụng</h2><input type="hidden" id="appId"><label for="name">Tên ứng dụng</label><input id="name" maxlength="70" required><label for="url">Đường dẫn HTTPS</label><input id="url" type="url" pattern="https://.*" required><label for="category">Nhóm</label><select id="category"><option>Quản lý</option><option>Báo cáo</option><option>Khác</option></select><label for="icon">Biểu tượng</label><select id="icon"><option>📊</option><option>📦</option><option>💼</option><option>🗂️</option><option>🌐</option><option>🛠️</option></select><label><input id="favorite" type="checkbox" style="width:auto"> Yêu thích</label><div class="actions"><button type="button" class="secondary" id="cancel">Hủy</button><button type="submit" class="primary">Lưu</button></div><div class="actions"><button type="button" id="delete" style="color:#ad2936">Xóa ứng dụng</button></div></form></dialog><input type="file" id="file" accept="application/json" hidden><script src="app.js"></script></body></html>
